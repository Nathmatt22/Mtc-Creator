<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MTC creator — éditeur de mods pour Luanti</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <header class="menubar">
    <div class="brand"><span class="brand-mark">MTC</span><span class="brand-name">creator</span></div>

    <nav class="menus">
      <div class="menu">
        <button class="menu-btn" type="button">Fichier</button>
        <div class="menu-panel">
          <button type="button" data-action="new-project">Nouveau projet</button>
          <button type="button" data-action="open-project">Ouvrir un projet (.mtc.json)</button>
          <button type="button" data-action="import-mod">Importer un mod existant…</button>
          <hr />
          <button type="button" data-action="save-project">Enregistrer le projet</button>
          <button type="button" data-action="export-project">Exporter le projet (.mtc.json)</button>
          <hr />
          <button type="button" data-action="export-zip" class="accent">Exporter le mod en ZIP</button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-btn" type="button">Éléments</button>
        <div class="menu-panel">
          <button type="button" data-action="new-element" data-type="block">Nouveau bloc</button>
          <button type="button" data-action="new-element" data-type="item">Nouvel item</button>
          <button type="button" data-action="new-element" data-type="tool">Nouvel outil</button>
          <button type="button" data-action="new-element" data-type="craft">Nouvelle recette</button>
          <button type="button" data-action="new-element" data-type="formspec">Nouvelle formspec</button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-btn" type="button">Ressources</button>
        <div class="menu-panel">
          <button type="button" data-action="open-textures">Textures du mod</button>
          <button type="button" data-action="upload-texture">Importer une image…</button>
          <hr />
          <button type="button" data-action="texture-editor">Éditeur de texture</button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-btn" type="button">Affichage</button>
        <div class="menu-panel">
          <button type="button" data-action="view-code">Code généré</button>
          <button type="button" data-action="toggle-console">Console</button>
          <button type="button" data-action="load-sample">Charger le projet d'exemple</button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-btn" type="button">Aide</button>
        <div class="menu-panel">
          <button type="button" data-action="help">Fonctionnement &amp; export</button>
          <hr />
          <a href="https://api.luanti.org/" target="_blank" rel="noopener">Documentation de l'API Luanti</a>
        </div>
      </div>
    </nav>

    <div class="menubar-title" id="menubar-title"></div>
    <div class="menubar-right"><span class="save-state" id="save-state">Sauvegarde locale</span></div>
  </header>

  <div class="toolbar">
    <div class="toolgroup">
      <button type="button" class="tbtn" data-action="new-project" title="Nouveau projet">Nouveau</button>
      <button type="button" class="tbtn" data-action="import-mod" title="Importer un mod existant">Importer</button>
      <button type="button" class="tbtn" data-action="save-project" title="Enregistrer (Ctrl+S)">Enregistrer</button>
    </div>
    <div class="toolsep"></div>
    <div class="toolgroup">
      <button type="button" class="tbtn new-el" data-action="new-element" data-type="block">＋ Bloc</button>
      <button type="button" class="tbtn new-el" data-action="new-element" data-type="item">＋ Item</button>
      <button type="button" class="tbtn new-el" data-action="new-element" data-type="tool">＋ Outil</button>
      <button type="button" class="tbtn new-el" data-action="new-element" data-type="craft">＋ Recette</button>
      <button type="button" class="tbtn new-el" data-action="new-element" data-type="formspec">＋ Formspec</button>
    </div>
    <div class="toolspacer"></div>
    <div class="toolgroup">
      <button type="button" class="tbtn" data-action="view-code">Code</button>
      <button type="button" class="tbtn accent" data-action="export-zip">Exporter le ZIP</button>
    </div>
  </div>

  <div class="workarea">
    <nav class="rail">
      <button type="button" class="rail-btn" data-view="workspace" title="Espace de travail">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>Éléments</span>
      </button>
      <button type="button" class="rail-btn" data-view="textures" title="Textures">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="9.5" r="1.6"/><path d="M4 18l5.2-5.4 3.3 3.2 2.6-2.6L20 18"/></svg>
        <span>Textures</span>
      </button>
      <button type="button" class="rail-btn" data-view="code" title="Code généré">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5L4 12l5 7"/><path d="M15 5l5 7-5 7"/></svg>
        <span>Code</span>
      </button>
      <div class="rail-gap"></div>
      <button type="button" class="rail-btn" data-action="help" title="Aide">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 114 2.3c-.9.6-1.6 1.2-1.6 2.3"/><circle cx="12" cy="17.2" r="0.9" fill="currentColor" stroke="none"/></svg>
        <span>Aide</span>
      </button>
    </nav>

    <aside class="sidebar">
      <div class="panel-head">Éléments du mod</div>
      <div class="project-chip" id="project-chip"></div>
      <div class="filter-row">
        <input type="search" id="tree-filter" placeholder="Filtrer les éléments" autocomplete="off" />
      </div>
      <div class="tree" id="tree"></div>
      <div class="sidebar-foot">
        <button type="button" class="mini-btn" data-action="new-element" data-type="block">＋ Élément</button>
      </div>
    </aside>

    <main class="center">
      <div class="tabbar" id="tabbar"></div>
      <div class="viewhost" id="viewhost"></div>
    </main>

    <aside class="inspector" id="inspector"></aside>
  </div>

  <footer class="console" id="console">
    <div class="console-head">
      <span class="console-title">Sortie</span>
      <span class="console-level" id="console-level">prêt</span>
      <div class="console-tools">
        <button type="button" class="link-btn" data-action="clear-console">Effacer</button>
        <button type="button" class="link-btn" data-action="toggle-console">Réduire</button>
      </div>
    </div>
    <div class="console-log" id="console-log"></div>
  </footer>
</div>

<input type="file" id="hidden-file" hidden />
<div class="modal-root" id="modal-root"></div>

<script src="js/zip.js"></script>
<script src="js/generators.js"></script>
<script src="js/project.js"></script>
<script src="js/app.js"></script>
</body>
</html>
