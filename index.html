<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-i18n="MTC creator — éditeur de mods pour Luanti">MTC creator — éditeur de mods pour Luanti</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <header class="menubar">
    <button type="button" class="brand" data-action="go-home" title="Mes projets" data-i18n-title="Mes projets">
      <span class="brand-mark">MTC</span><span class="brand-name">creator</span>
    </button>

    <nav class="menus">
      <div class="menu">
        <button class="menu-btn" type="button" data-i18n="Fichier">Fichier</button>
        <div class="menu-panel">
          <button type="button" data-action="go-home" data-i18n="Mes projets">Mes projets</button>
          <hr />
          <button type="button" data-action="new-project" data-i18n="Nouveau projet">Nouveau projet</button>
          <button type="button" data-action="open-project" data-i18n="Ouvrir un projet (.mtc.json)">Ouvrir un projet (.mtc.json)</button>
          <button type="button" data-action="import-mod" data-i18n="Importer un mod existant…">Importer un mod existant…</button>
          <hr />
          <button type="button" data-action="save-project" data-i18n="Enregistrer le projet">Enregistrer le projet</button>
          <button type="button" data-action="export-project" data-i18n="Exporter le projet (.mtc.json)">Exporter le projet (.mtc.json)</button>
          <hr />
          <button type="button" data-action="export-zip" class="accent" data-i18n="Exporter le mod en ZIP">Exporter le mod en ZIP</button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-btn" type="button" data-i18n="Éléments">Éléments</button>
        <div class="menu-panel">
          <button type="button" data-action="new-element" data-type="block" data-i18n="Nouveau bloc">Nouveau bloc</button>
          <button type="button" data-action="new-element" data-type="item" data-i18n="Nouvel item">Nouvel item</button>
          <button type="button" data-action="new-element" data-type="tool" data-i18n="Nouvel outil">Nouvel outil</button>
          <button type="button" data-action="new-element" data-type="craft" data-i18n="Nouvelle recette">Nouvelle recette</button>
          <button type="button" data-action="new-element" data-type="formspec" data-i18n="Nouvelle formspec">Nouvelle formspec</button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-btn" type="button" data-i18n="Ressources">Ressources</button>
        <div class="menu-panel">
          <button type="button" data-action="open-textures" data-i18n="Textures du mod">Textures du mod</button>
          <button type="button" data-action="upload-texture" data-i18n="Importer une image…">Importer une image…</button>
          <hr />
          <button type="button" data-action="texture-editor" data-i18n="Éditeur de texture">Éditeur de texture</button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-btn" type="button" data-i18n="Affichage">Affichage</button>
        <div class="menu-panel">
          <button type="button" data-action="view-code" data-i18n="Code généré">Code généré</button>
          <button type="button" data-action="toggle-console" data-i18n="Console">Console</button>
          <button type="button" data-action="load-sample" data-i18n="Charger le projet d'exemple">Charger le projet d'exemple</button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-btn" type="button" data-i18n="Aide">Aide</button>
        <div class="menu-panel">
          <button type="button" data-action="help" data-i18n="Fonctionnement &amp; export">Fonctionnement &amp; export</button>
          <hr />
          <a href="https://api.luanti.org/" target="_blank" rel="noopener" data-i18n="Documentation de l'API Luanti">Documentation de l'API Luanti</a>
        </div>
      </div>
    </nav>

    <div class="menubar-title" id="menubar-title"></div>
    <div class="menubar-right">
      <button type="button" class="tbtn accent play-game" data-action="launch-game" title="Lancer le jeu avec le mod du projet" data-i18n-title="Lancer le jeu avec le mod du projet" data-i18n="Lancer le jeu">Lancer le jeu</button>
      <select id="lang-select" class="lang-select" title="Langue / Language" aria-label="Langue / Language">
        <option value="fr">FR — Français</option>
        <option value="en">EN — English</option>
      </select>
      <span class="save-state" id="save-state" data-i18n="Sauvegarde locale">Sauvegarde locale</span>
    </div>
  </header>

  <div class="toolbar">
    <div class="toolgroup">
      <span class="tool-label" data-i18n="Projet">Projet</span>
      <button type="button" class="tbtn" data-action="go-home" title="Mes projets" data-i18n-title="Mes projets" data-i18n="Projets">Projets</button>
      <button type="button" class="tbtn" data-action="new-project" title="Nouveau projet" data-i18n-title="Nouveau projet" data-i18n="Nouveau">Nouveau</button>
      <button type="button" class="tbtn" data-action="import-mod" title="Importer un mod existant" data-i18n-title="Importer un mod existant…" data-i18n="Importer">Importer</button>
      <button type="button" class="tbtn" data-action="save-project" title="Enregistrer (Ctrl+S)" data-i18n-title="Enregistrer (Ctrl+S)" data-i18n="Enregistrer">Enregistrer</button>
    </div>
    <div class="toolsep"></div>
    <div class="toolgroup">
      <span class="tool-label" data-i18n="Créer">Créer</span>
      <button type="button" class="tbtn new-el" data-action="new-element" data-type="block" data-i18n="＋ Bloc">＋ Bloc</button>
      <button type="button" class="tbtn new-el" data-action="new-element" data-type="item" data-i18n="＋ Item">＋ Item</button>
      <button type="button" class="tbtn new-el" data-action="new-element" data-type="tool" data-i18n="＋ Outil">＋ Outil</button>
      <button type="button" class="tbtn new-el" data-action="new-element" data-type="craft" data-i18n="＋ Recette">＋ Recette</button>
      <button type="button" class="tbtn new-el" data-action="new-element" data-type="formspec" data-i18n="＋ Formspec">＋ Formspec</button>
    </div>
    <div class="toolspacer"></div>
    <div class="toolgroup">
      <span class="tool-label" data-i18n="Sortie">Sortie</span>
      <button type="button" class="tbtn" data-action="view-code" data-i18n="Code">Code</button>
      <button type="button" class="tbtn accent" data-action="export-zip" data-i18n="Exporter le mod en ZIP">Exporter le mod en ZIP</button>
    </div>
  </div>

  <div class="workarea">
    <nav class="rail">
      <button type="button" class="rail-btn" data-view="workspace" title="Espace de travail" data-i18n-title="Espace de travail">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span data-i18n="Éléments">Éléments</span>
      </button>
      <button type="button" class="rail-btn" data-view="textures" title="Textures" data-i18n-title="Textures">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="9.5" r="1.6"/><path d="M4 18l5.2-5.4 3.3 3.2 2.6-2.6L20 18"/></svg>
        <span data-i18n="Textures">Textures</span>
      </button>
      <button type="button" class="rail-btn" data-view="code" title="Code généré" data-i18n-title="Code généré">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5L4 12l5 7"/><path d="M15 5l5 7-5 7"/></svg>
        <span data-i18n="Code">Code</span>
      </button>
      <div class="rail-gap"></div>
      <button type="button" class="rail-btn" data-action="help" title="Aide" data-i18n-title="Aide">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 114 2.3c-.9.6-1.6 1.2-1.6 2.3"/><circle cx="12" cy="17.2" r="0.9" fill="currentColor" stroke="none"/></svg>
        <span data-i18n="Aide">Aide</span>
      </button>
    </nav>

    <aside class="sidebar">
      <div class="panel-head" data-i18n="Éléments du mod">Éléments du mod</div>
      <div class="project-chip" id="project-chip"></div>
      <div class="filter-row">
        <input type="search" id="tree-filter" placeholder="Filtrer les éléments" data-i18n-placeholder="Filtrer les éléments" autocomplete="off" />
      </div>
      <div class="tree" id="tree"></div>
      <div class="sidebar-foot">
        <button type="button" class="mini-btn" data-action="new-element" data-type="block" data-i18n="＋ Élément">＋ Élément</button>
      </div>
    </aside>

    <main class="center">
      <div class="tabbar" id="tabbar"></div>
      <div class="viewhost" id="viewhost"></div>
    </main>

    <aside class="inspector" id="inspector"></aside>
  </div>

  <footer class="console" id="console">
    <div class="console-head">
      <span class="console-title" data-i18n="Journal">Journal</span>
      <span class="console-level" id="console-level" data-i18n="prêt">prêt</span>
      <div class="console-tools">
        <button type="button" class="link-btn" data-action="clear-console" data-i18n="Effacer">Effacer</button>
        <button type="button" class="link-btn" data-action="toggle-console" data-i18n="Réduire">Réduire</button>
      </div>
    </div>
    <div class="console-log" id="console-log"></div>
  </footer>
</div>

<input type="file" id="hidden-file" hidden />
<div class="modal-root" id="modal-root"></div>

<script src="js/i18n.js"></script>
<script src="js/zip.js"></script>
<script src="js/generators.js"></script>
<script src="js/project.js"></script>
<script src="js/app.js"></script>
</body>
</html>
